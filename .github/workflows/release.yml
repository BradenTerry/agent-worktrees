name: Release

# Push a version tag to publish; the run compiles, packages the .vsix, creates a
# GitHub release, and publishes to the VS Code Marketplace when VSCE_PAT is set. The
# version is the single source of truth and is injected into package.json at build
# time (the committed "version" is just a placeholder and is never edited by hand).
#
# The release channel is chosen per release, not encoded in the version number:
#
#   git tag v4.5.0     && git push origin v4.5.0       -> regular channel
#   git tag v4.5.0-pre && git push origin v4.5.0-pre   -> pre-release channel
#
# Both publish the plain version (4.5.0); the `-pre` suffix names the channel and
# never reaches the manifest. The manual workflow_dispatch run takes the channel
# as an input instead.
#
# So the version is free: any X.Y.Z that is higher than the last one. Bump the
# patch as far as you like (4.4.31, 4.4.32, ... 4.4.1001), bump the minor by one,
# whatever suits the change. This replaced a scheme where the minor's PARITY
# picked the channel (odd = pre-release, even = regular), which is what the VS
# Code docs recommend but nothing enforces: vsce validates only that the version
# is valid semver with no prerelease suffix (see validateVersion /
# validateManifestForPublishing in @vscode/vsce), so parity was costing every
# stable minor a skipped number for a line that mostly went unused.
#
# What the parity bought, and what replaces it: the two channels shared no version
# numbers, so a preview could never consume a stable one. Now they do share a
# line, and the Marketplace is explicit that they cannot overlap - "if 1.2.3 is
# uploaded as a pre-release, the next regular release must be uploaded with a
# distinct version, such as 1.2.4"
# (code.visualstudio.com/api/working-with-extensions/publishing-extension).
# So **a pre-release of 4.5.0 means the stable release of that work is 4.5.1**. The "already released" check in the resolve step below catches the
# mistake before anything is published rather than at the Marketplace.
#
# A pre-release tag may point at a PR branch head - previewing unmerged work is
# the point of the channel - while regular releases are only ever tagged on main.
#
# Publishing any pre-release build is what makes the "Switch to Pre-Release Version"
# button appear on the listing; users opt in per-install.
#
# Both triggers already require push/write access, so a random fork or contributor
# cannot start a release. Two further gates narrow that to the owner:
#
#   - the guard job below fails the run unless github.actor is the repository owner;
#   - the publish job targets the protected "release" environment, which requires an
#     approval from BradenTerry and only accepts main or a v* tag. VSCE_PAT lives in
#     that environment, so no other job in any workflow can read it, and editing this
#     file to drop the guard does not get you the token.
#
# The environment approval is the real enforcement; the guard just fails fast.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 4.5.0 (plain X.Y.Z, no v, no suffix)'
        required: true
        type: string
      channel:
        description: 'Which channel to publish to'
        required: true
        default: release
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: write

# Run bundled JavaScript actions on Node 24 (Node 20 action runtime is deprecated).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fail fast, and before any secret is in scope, if the run was not started by the
  # repository owner. String comparison in GitHub expressions is case-insensitive.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only the repository owner may release
        if: github.actor != github.repository_owner
        run: |
          echo "::error::Release refused: ${{ github.actor }} is not the repository owner (${{ github.repository_owner }})."
          exit 1

  publish:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve version and release channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The channel comes from the trigger, and the version never carries it.
          # A tag ending -pre publishes the plain version to the pre-release
          # channel; the suffix names the tag, not the build.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"          # tolerate a leading v in the input
            version="${version%-pre}"       # ... and a suffix the channel input already covers
            channel="${{ inputs.channel }}"
            source="Manual run"
          else
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              *-pre) version="${version%-pre}"; channel="pre-release" ;;
              *)     channel="release" ;;
            esac
            source="Tag push $GITHUB_REF_NAME"
          fi
          # What goes in the manifest is plain X.Y.Z. The Marketplace rejects
          # semver prerelease suffixes outright (-pre.1, -rc.2), which is why the
          # channel is a tag suffix stripped here rather than part of the version.
          #
          # Each part is a number with no leading zero. Multi-digit is fine and
          # expected - the patch runs on into v4.4.10, v4.4.31, v4.4.1001 - but a
          # padded one is not a version, and it fails quietly rather than loudly:
          # `npm version 4.4.01` does not error, it normalizes to 4.4.1, so a
          # v4.4.01 tag would build and publish a .vsix claiming an ALREADY
          # RELEASED version. Caught here, where the message can say what is wrong.
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'$version' is not a plain X.Y.Z version. Each part must be a number with no leading zero (4.4.10, not 4.4.010). The only suffix a tag may carry is '-pre', which selects the pre-release channel (v4.5.0-pre publishes 4.5.0)."
            exit 1
          fi
          if [ "$channel" = "pre-release" ]; then
            tag="v$version-pre"
            pre_release_flag="--pre-release"
          else
            tag="v$version"
            pre_release_flag=""
          fi
          # A version can only be published once, and the two channels now share
          # one number line, so the other channel may already have spent this one.
          # vsce would reject it at the very last step, after the GitHub release
          # exists; fail here instead, while nothing has been published.
          for existing in "v$version" "v$version-pre"; do
            [ "$existing" = "$tag" ] && continue
            if gh release view "$existing" >/dev/null 2>&1; then
              echo "::error::Version $version was already released as $existing. A version can only be published once, in either channel - pick a higher one."
              exit 1
            fi
          done
          echo "$source -> $channel channel (publishing $version as $tag)"
          echo "pre_release_flag=$pre_release_flag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set version
        run: npm version "${{ steps.channel.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Compile (typecheck + build to out/)
        run: npm run compile

      - name: Test
        run: npm test

      # The listing's screenshots are absolute raw.githubusercontent URLs, because
      # the Marketplace renders the README off its own site and cannot resolve a
      # relative path. In the repo they point at main, which is right there - the
      # file on main should show what main looks like. Published, that same ref
      # would keep resolving against main forever: land a UI change without
      # cutting a release and the listing starts advertising a panel that nobody
      # can install yet.
      #
      # So the ref is pinned to this release's tag on the way into the .vsix, and
      # only there. The working tree is rewritten and never committed (the same
      # thing `npm version --no-git-tag-version` above does), so main keeps its
      # live refs and each published listing keeps the screenshots of the build it
      # is actually selling. The tag exists by the time anyone loads the page: the
      # `gh release create` step below runs before the publish step.
      - name: Pin the listing's screenshots to this release's tag
        env:
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          set -euo pipefail
          before="$(grep -c "/agent-worktrees/main/images/" MARKETPLACE.md)"
          if [ "$before" -eq 0 ]; then
            echo "::error::No main-pinned image URLs found in MARKETPLACE.md. The listing's screenshot URLs changed shape - update this step, or a release will ship unpinned images."
            exit 1
          fi
          sed -i "s#/agent-worktrees/main/images/#/agent-worktrees/$TAG/images/#g" MARKETPLACE.md
          echo "Pinned $before screenshot URL(s) to $TAG."
          if grep -q "/agent-worktrees/main/images/" MARKETPLACE.md; then
            echo "::error::Some image URLs still point at main after rewriting."
            exit 1
          fi

      - name: Package extension
        run: npx --yes @vscode/vsce package ${{ steps.channel.outputs.pre_release_flag }} --readme-path MARKETPLACE.md --out agent-worktrees.vsix

      # On a tag push the tag already exists; on a manual run gh creates it at this commit
      # (a tag created with GITHUB_TOKEN does not re-trigger the push-tag run above).
      - name: Create GitHub release with .vsix
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_FLAG: ${{ steps.channel.outputs.pre_release_flag }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          gh release create "$TAG" agent-worktrees.vsix \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            ${PRERELEASE_FLAG:+--prerelease}

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish ${{ steps.channel.outputs.pre_release_flag }} --packagePath agent-worktrees.vsix -p "$VSCE_PAT"
