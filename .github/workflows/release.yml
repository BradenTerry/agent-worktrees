name: Release

# Push a version tag to publish; the run compiles, packages the .vsix, creates a
# GitHub release, and publishes to the VS Code Marketplace when VSCE_PAT is set. The
# version is the single source of truth and is injected into package.json at build
# time (the committed "version" is just a placeholder and is never edited by hand).
#
# The release channel is encoded in the version's MINOR number, the convention the
# VS Code publishing docs recommend (the Marketplace rejects semver suffixes like
# -pre.1, so the parity of the minor is the only standard way to keep the two
# channels' version lines apart):
#
#   odd minor   -> pre-release channel:  git tag v3.9.0 && git push origin v3.9.0
#   even minor  -> regular channel:      git tag v4.0.0 && git push origin v4.0.0
#
# So pre-release builds of an upcoming vX.EVEN.0 stack up on the odd line below it
# (3.9.0, 3.9.1, ... previewing 4.0.0), never consuming a stable version. A
# pre-release tag may point at a PR branch head - previewing unmerged work is the
# point of the channel - while regular releases are only ever tagged on main. The
# convention starts at 3.9/4.0; older tags predate it. The manual workflow_dispatch
# run publishes the same way from a typed version instead of a pushed tag.
#
# Publishing any pre-release build is what makes the "Switch to Pre-Release Version"
# button appear on the listing; users opt in per-install.
#
# Both triggers already require push/write access, so a random fork or contributor
# cannot start a release. Two further gates narrow that to the owner:
#
#   - the guard job below fails the run unless github.actor is the repository owner;
#   - the publish job targets the protected "release" environment, which requires an
#     approval from BradenTerry and only accepts main or a v* tag. VSCE_PAT lives in
#     that environment, so no other job in any workflow can read it, and editing this
#     file to drop the guard does not get you the token.
#
# The environment approval is the real enforcement; the guard just fails fast.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.3 (plain number, no v, no -suffix; an odd minor publishes to the pre-release channel, an even minor to the regular one)'
        required: true
        type: string

permissions:
  contents: write

# Run bundled JavaScript actions on Node 24 (Node 20 action runtime is deprecated).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fail fast, and before any secret is in scope, if the run was not started by the
  # repository owner. String comparison in GitHub expressions is case-insensitive.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only the repository owner may release
        if: github.actor != github.repository_owner
        run: |
          echo "::error::Release refused: ${{ github.actor }} is not the repository owner (${{ github.repository_owner }})."
          exit 1

  publish:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve version and release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"          # tolerate a leading v in the input
            source="Manual run"
          else
            version="${GITHUB_REF_NAME#v}"
            source="Tag push $GITHUB_REF_NAME"
          fi
          # Plain X.Y.Z only. The Marketplace rejects semver suffixes (-pre.1,
          # -rc.2), so a suffixed tag can never publish; fail it here with the
          # reason instead of deep inside vsce.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a plain X.Y.Z version. The Marketplace does not accept semver suffixes; use an odd minor (e.g. 3.9.1) for a pre-release."
            exit 1
          fi
          # The channel is the minor's parity: odd = pre-release, even = regular.
          minor="$(printf '%s' "$version" | cut -d. -f2)"
          if [ "$((minor % 2))" -eq 1 ]; then
            echo "$source -> pre-release channel (publishing $version)"
            echo "pre_release_flag=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "$source -> regular channel (publishing $version)"
            echo "pre_release_flag=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set version
        run: npm version "${{ steps.channel.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Compile (typecheck + build to out/)
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package extension
        run: npx --yes @vscode/vsce package ${{ steps.channel.outputs.pre_release_flag }} --readme-path MARKETPLACE.md --out agent-worktrees.vsix

      # On a tag push the tag already exists; on a manual run gh creates it at this commit
      # (a tag created with GITHUB_TOKEN does not re-trigger the push-tag run above).
      - name: Create GitHub release with .vsix
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_FLAG: ${{ steps.channel.outputs.pre_release_flag }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          gh release create "$TAG" agent-worktrees.vsix \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            ${PRERELEASE_FLAG:+--prerelease}

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish ${{ steps.channel.outputs.pre_release_flag }} --packagePath agent-worktrees.vsix -p "$VSCE_PAT"
